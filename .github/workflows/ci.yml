name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/gcp/gke
          - modules/gcp/cloud-run
          - modules/gcp/secret-manager
          - modules/azure/aks
          - modules/k8s/external-secret-gsm
          - modules/k8s/kafka-topic-crossplane
          - examples/gcp-platform
          - examples/azure-aks
          - examples/k8s-app
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}

      - name: terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --chdir=${{ matrix.dir }} --config=$GITHUB_WORKSPACE/.tflint.hcl
        env:
          GITHUB_TOKEN: ${{ github.token }}

  crossplane:
    name: crossplane manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed modules/k8s/kafka-topic-crossplane/crossplane

  security:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          framework: terraform
          # Reporta hallazgos sin bloquear: los módulos exponen por variable
          # decisiones como ingress público o CMEK, que dependen de cada equipo.
          soft_fail: true
